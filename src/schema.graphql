query LuroWinner($address: Bytes, $round: BigInt) {
    winnerCalculateds(where: { address: $address, round: $round }) {
        winner
        winnerOffset
        payout
        transactionHash
        round
        bet
    }
}

query LuroWinners($address: Bytes) {
    winnerCalculateds(where: { address: $address }, first: 100, orderBy: round, orderDirection: desc) {
        winner
        winnerOffset
        payout
        transactionHash
        round
        bet
    }
}


query LuroRounds($address: Bytes) {
    rounds(where: { address: $address }, orderBy: round, orderDirection: desc, first: 1000) {
        round
        address
        betsAmount
        betsCount
        status
        winnerAddress
        winnerOffset
        winnerPayout
    }
}

query LuroRoundBets($address: Bytes, $round: BigInt) {
    bets(where: { address: $address, round_: { round: $round } }, first: 1000, orderBy: blockTimestamp, orderDirection: asc) {
        player
        amount
        betAddress
    }
}

query LuroRoundsByPlayer($address: Bytes, $player: Bytes) {
    rounds(where: {address: $address, bets_: {player: $player}}, orderBy: round, orderDirection: desc) {
        round
        address
        betsAmount
        betsCount
        status
        winnerAddress
        winnerOffset
        winnerPayout
    }
}
